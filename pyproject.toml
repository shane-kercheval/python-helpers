[project]
name = "helpsk"
version = "0.2.0"
description = "Python helper functions and classes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "python-dateutil>=2.9.0.post0",
    "pyyaml>=6.0.4",
    "seaborn>=0.13.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "sqlalchemy>=2.1.9",
    "psycopg2-binary>=2.9.13",
    "pyarrow>=26.0.1",
    "snowflake-connector-python>=5.2.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["helpsk"]

[build-system]
requires = ["hatchling>=1.17.1"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
